# Toolchain-only cross-file for SDCC on the 8051; pair it with `-Dkeyboard=<name>` and the board's options.

[constants]
# Allow easy overriding of the default path and prefix
sdcc_path = ''
sdcc_prefix = ''
sdcc_base = sdcc_path / sdcc_prefix

[binaries]
# SDCC is not a C compiler meson can drive, so it is looked up as a plain program, not as `c`.
sdcc = sdcc_base + 'sdcc'
sdar = sdcc_base + 'sdar'
packihx = sdcc_base + 'packihx'

[host_machine]
system = 'bare-metal'
cpu_family = 'mcs51'
cpu = 'mcs51'
endian = 'little'
