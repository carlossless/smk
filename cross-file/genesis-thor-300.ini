# This is a cross-file for the Genesis Thor 300: an SH68F881 with a 6x19 LED matrix, no radio.

[binaries]
sdcc = 'sdcc'
sdar = 'sdar'
packihx = 'packihx'

[host_machine]
system = 'bare-metal'
cpu_family = 'mcs51'
cpu = 'sh68f881'
endian = 'little'

[project options]
keyboard = 'genesis-thor-300'
platform = 'sh68f881'
keyboard_layout = 'default'
vendor_id = '0x258a'
product_id = '0x001f'
led_rows = 6
led_cols = 19
led_cx2 = 17
led_cy2 = 5
