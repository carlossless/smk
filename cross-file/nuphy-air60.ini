# This is a cross-file for the NuPhy Air60 v1: an SH68F90A with a 5x16 LED matrix and a BK3632 radio.

[binaries]
sdcc = 'sdcc'
sdar = 'sdar'
packihx = 'packihx'

[host_machine]
system = 'bare-metal'
cpu_family = 'mcs51'
cpu = 'sh68f90'
endian = 'little'

[project options]
keyboard = 'nuphy-air60'
platform = 'sh68f90'
keyboard_layout = 'default'
vendor_id = '0x05ac'
product_id = '0x024f'
wireless = 'bk3632'
led_rows = 5
led_cols = 16
led_cx2 = 13
led_cy2 = 4
