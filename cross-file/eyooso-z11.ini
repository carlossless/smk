# This is a cross-file for the E-YOOSO Z11: an SH68F90A (BYK901) with a 5x14 LED matrix, no radio.

[binaries]
sdcc = 'sdcc'
sdar = 'sdar'
packihx = 'packihx'

[host_machine]
system = 'bare-metal'
cpu_family = 'mcs51'
cpu = 'sh68f90'
endian = 'little'

[project options]
keyboard = 'eyooso-z11'
platform = 'sh68f90'
keyboard_layout = 'default'
vendor_id = '0x258a'
product_id = '0x002a'
led_rows = 5
led_cols = 14
led_cx2 = 13
led_cy2 = 4
